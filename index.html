<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="preconnect" href="https://dsc106.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <!-- Versions are pinned here once; map.js and traffic.js import the bare names. -->
    <script type="importmap">
      {
        "imports": {
          "mapbox-gl": "https://cdn.jsdelivr.net/npm/mapbox-gl@3.33.0/+esm",
          "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <div>
        <h1>Bikewatching</h1>
        <p class="description">
          Bluebikes traffic at 453 stations in Boston and Cambridge, March 2024. Drag the slider to see
          how it changes through the day.
        </p>
      </div>
      <label>
        Filter by time:
        <input id="time-slider" type="range" min="-1" max="1440" value="-1" disabled />
        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
      </label>
    </header>
    <p id="load-error" role="alert" hidden>Couldn't load the Bluebikes data. Refresh the page to try again.</p>
    <div id="map">
      <svg></svg>
    </div>
    <div id="tooltip" role="tooltip" hidden><strong class="tooltip-name"></strong><span class="tooltip-trips"></span></div>
    <div class="legend">
      <span class="legend-title">Legend:</span>
      <div style="--departure-ratio: 1">More departures</div>
      <div style="--departure-ratio: 0.5">Balanced</div>
      <div style="--departure-ratio: 0">More arrivals</div>
    </div>
    <!-- At the end of the body so the message exists if any module (map.js,
         traffic.js, Mapbox or D3 from the CDN) fails to load. -->
    <script src="map.js" type="module" onerror="document.getElementById('load-error').hidden = false"></script>
  </body>
</html>
